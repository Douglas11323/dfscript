name: Diário Oficial - Coleta Diária

on:
  schedule:
    # 11h UTC = 8h em Brasília (BRT, UTC-3, sem horário de verão)
    - cron: "0 11 * * 1-5"   # segunda a sexta
  workflow_dispatch: {}       # permite rodar manualmente pelo botão "Run workflow"

# Necessário para o job poder commitar de volta no repositório
permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Instalar navegador do Playwright
        run: playwright install --with-deps chromium

      - name: Rodar script de coleta
        run: python diario_exonerados_corrigido.py

      - name: Commitar planilha atualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add saida/movimentacoes.xlsx
          git diff --staged --quiet || git commit -m "Atualiza movimentações - $(date +'%d/%m/%Y')"
          git push
